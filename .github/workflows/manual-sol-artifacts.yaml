name: Manual sol artifacts
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to deploy"
        required: true
        type: choice
        options:
          - merkle-words
          - merkle-words@0_1_1
      verify:
        description: "Verify on the block explorer"
        required: false
        type: boolean
        default: true
jobs:
  deploy:
    uses: rainlanguage/rainix/.github/workflows/rainix-manual-sol-artifacts.yaml@main
    with:
      suite: ${{ inputs.suite }}
      verify: ${{ inputs.verify }}
    secrets: inherit
