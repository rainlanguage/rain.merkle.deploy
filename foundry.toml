# Release metadata, not foundry config: `rainix-tag-release` rewrites `version`
# from the tag it is triggered by. `[external.*]` is the section foundry
# reserves for another tool's config: it never merges it into a profile and
# never warns about it.
[external.package]
name = "rain-merkle-deploy"
# The version of the LAST Soldeer publish, moved only by a release.
version = "0.1.0"

[profile.default]
src = 'src'
test = 'test'
out = 'out'

# The candidate record and the generated pointers are a pure function of these.
solc = "0.8.25"
optimizer = true
optimizer_runs = 1000
evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false
libs = ["node_modules", "dependencies"]

fs_permissions = [
  { access = "read", path = "./foundry.toml" },
  { access = "read", path = "./.env.example" },
  { access = "read-write", path = "./.staged-config" },
  { access = "read", path = "./script/build.sh" },
  { access = "read-write", path = "./src" },
  { access = "read-write", path = "./meta" },
  { access = "read", path = "./test/proof/tree.json" },
  { access = "read", path = ".github/workflows/manual-sol-artifacts.yaml" },
]

# Pins compiler output rather than behaviour; see
# `.claude/rules/mutation-profile.md`.
[profile.mutation]
no_match_contract = "MerkleWordsDeploySnapshotTest|MerkleWordsPointersTest"

# `recursive_deps` is off, so every package an import resolves through is
# declared here.
[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"
"rain-deploy" = "0.1.25"
"rain-extrospection" = "0.1.16"
"rain-factory" = "0.2.5"
"rain-intorastring" = "0.1.4"
"rain-lib-hash" = "0.1.27"
"rain-lib-memkv" = "0.2.0"
"rain-lib-typecast" = "0.1.4"
"rain-math-binary" = "0.1.4"
"rain-math-float" = "0.3.10"
"rain-math-float-deploy" = "0.1.7"
"rain-metadata" = "0.1.43"
"rain-sol-codegen" = "0.1.39"
"rain-solmem" = "0.1.28"
"rain-string" = "0.3.9"
"rain-tofu-erc20-decimals" = "0.1.4"
"rainlang" = "0.2.27"

[soldeer]
recursive_deps = false

# One alias per network `supportedNetworks()` declares, which is what
# `script/Deploy.sol` broadcasts to. Generated by `script/Build.sol` between the
# markers; `Git is clean` fails a tree where they drift.
# rain-deploy:generated:rpc_endpoints:begin
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
bsc = "${BSC_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
flare = "${FLARE_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
# rain-deploy:generated:rpc_endpoints:end

# `rainix-manual-sol-artifacts` passes `--verify` by default and exports exactly
# these variable names. Generated with `[rpc_endpoints]`, from the same
# declaration, so the two cannot name different networks.
# rain-deploy:generated:etherscan:begin
[etherscan]
arbitrum = { key = "${CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY}", chain = 42161 }
base = { key = "${CI_DEPLOY_BASE_ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY}", chain = 84532 }
bsc = { key = "${CI_DEPLOY_BSC_ETHERSCAN_API_KEY}", chain = 56 }
ethereum = { key = "${CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY}", chain = 1 }
flare = { key = "${CI_DEPLOY_FLARE_ETHERSCAN_API_KEY}", chain = 14 }
hyperevm = { key = "${CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY}", chain = 999 }
polygon = { key = "${CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY}", chain = 137 }
robinhood = { key = "${CI_DEPLOY_ROBINHOOD_ETHERSCAN_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
# rain-deploy:generated:etherscan:end
